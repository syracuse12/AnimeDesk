name: Bug report
about: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys, cookies or full
        personal paths. Security issues go through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: AnimeDesk version
      description: From the app footer, or the git commit you built.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - hianime
        - archive
        - local
        - not provider specific
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 23H2 build 22631
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for ...
        2. Open episode ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Console output from the terminal that ran the launcher is useful.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: mpv fallback used? Auto-skip on? Does it happen every time?
    validations:
      required: false